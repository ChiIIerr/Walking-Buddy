name: Android checks and bundles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # Hosted Ubuntu includes SDK tools and accepted licenses. The old
      # setup-android action tried to install the removed 'tools' package.
      - name: Install compile SDK
        run: |
          mkdir -p ci-logs
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 2>&1 | tee ci-logs/sdk.log
      - name: Test, lint, and build both distribution formats
        run: |
          ./gradlew --no-daemon --continue testDebugUnitTest lintDebug lintRelease assembleDebug bundleRelease --stacktrace 2>&1 | tee ci-logs/build.log
          test -f app/build/reports/tests/testDebugUnitTest/index.html
          test -f app/build/reports/lint-results-debug.html
          test -f app/build/reports/lint-results-release.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Walking-Buddy-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # CI has no private key. Signed, verified releases are in dist/.
          name: Walking-Buddy-unsigned-validation-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && hashFiles('app/build/reports/**') != '' }}
        with:
          name: Android-reports
          path: app/build/reports/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && hashFiles('ci-logs/**') != '' }}
        with:
          name: Android-build-logs
          path: ci-logs/
          if-no-files-found: error
